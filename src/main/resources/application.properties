# Porta dinâmica exigida pelo Render
server.port=${PORT:8080}

# Configuração do H2 (Armazena os dados num ficheiro local para não se perderem ao reiniciar)
spring.datasource.url=jdbc:h2:file:./data/acib_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ativar a consola do H2 (opcional, para visualizares a base de dados em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
