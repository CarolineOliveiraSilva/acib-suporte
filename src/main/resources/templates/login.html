<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACIB - Portal de Suporte | Entrar</title>
   <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h1>ACIB Suporte</h1>
                <p>Associação Comercial e Industrial de Bambuí</p>
            </div>

            <!-- Formulário de Autenticação -->
            <form th:action="@{/login}" method="post" class="login-form">
                
                <!-- Alerta de Erro (se houver falha de autenticação) -->
                <div th:if="${param.error}" class="alert alert-error" role="alert">
                    E-mail ou senha inválidos. Verifique suas credenciais.
                </div>

                <div class="form-group">
                    <label for="username">E-mail institucional ou de associado</label>
                    <input type="email" id="username" name="username" required 
                           placeholder="seu.email@empresa.com.br" 
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Senha de acesso</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="••••••••" 
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Entrar no Sistema</button>
            </form>

            <div class="login-footer">
                <a href="#" class="link-recuperar">Esqueceu sua senha?</a>
                <p>Ainda não é associado? <a href="#">Solicite seu cadastro</a></p>
            </div>
        </div>
    </main>
</body>
</html>
