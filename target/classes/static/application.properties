# Porta onde a aplicação vai rodar (padrão é 8080)
server.port=8080

# Configuração de Conexão com o Banco de Dados PostgreSQL (substitua com suas credenciais quando for usar)
spring.datasource.url=jdbc:postgresql://localhost:5432/acib_db
spring.datasource.username=postgres
spring.datasource.password=Expedito@3107

# Configuração do JPA / Hibernate para criar/atualizar as tabelas automaticamente no banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração do Thymeleaf para ambiente de desenvolvimento (desativa o cache para atualizar o HTML instantaneamente ao salvar)
spring.thymeleaf.cache=false